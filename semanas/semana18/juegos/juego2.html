<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Volitivo Master | Cohortativo y Yusivo - Semana 18</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
      background: linear-gradient(145deg, #2a1a3a, #1a0f2a);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .game-wrapper {
      max-width: 650px;
      width: 100%;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(8px);
      border-radius: 56px;
      padding: 20px;
      border: 1px solid rgba(200,150,200,0.3);
    }
    .chain-stats {
      display: flex;
      justify-content: space-between;
      background: rgba(0,0,0,0.5);
      border-radius: 40px;
      padding: 12px 20px;
      margin-bottom: 20px;
      color: #ffd966;
    }
    .question-panel {
      background: linear-gradient(135deg, #fef9e6, #f5e6c8);
      border-radius: 40px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
    }
    .hebrew-verb-large {
      font-size: 2rem;
      font-family: 'Times New Roman', 'Arial Hebrew', serif;
      direction: rtl;
      background: #1a2a3a;
      display: inline-block;
      padding: 15px 25px;
      border-radius: 50px;
      color: #ffefb9;
      margin: 12px 0;
    }
    .cards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    .card-btn {
      background: #2c3e50;
      border: 2px solid #d4a373;
      padding: 14px 8px;
      border-radius: 28px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #ffefcf;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .card-btn:active { transform: scale(0.96); }
    .card-btn.correct-card { background: #27ae60; border-color: #f1c40f; box-shadow: 0 0 15px #27ae60; }
    .card-btn.wrong-card { background: #c0392b; text-decoration: line-through; }
    .card-btn.disabled-card { pointer-events: none; opacity: 0.6; }
    .feedback { background: rgba(0,0,0,0.7); border-radius: 30px; padding: 12px; margin: 15px 0; text-align: center; color: #ffd966; }
    .action-btn { width: 100%; background: linear-gradient(95deg, #d4a373, #b5835a); border: none; padding: 14px; border-radius: 50px; font-weight: bold; font-size: 1rem; color: #1a0f0a; cursor: pointer; }
    .action-btn:active { transform: scale(0.98); }
    .action-btn:disabled { opacity: 0.5; cursor: default; }
    @keyframes floatReward { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-70px); } }
    .reward { position: fixed; pointer-events: none; font-size: 1.8rem; animation: floatReward 0.8s forwards; z-index: 1000; }
    @media (max-width: 480px) { .hebrew-verb-large { font-size: 1.3rem; padding: 10px 16px; } .card-btn { font-size: 0.65rem; padding: 10px 5px; } }
  </style>
</head>
<body>
<div class="game-wrapper">
  <div class="chain-stats"><span>📚 Aciertos: <span id="correctCount">0</span></span><span>⚡ Racha: <span id="streakCount">0</span></span><span>💔 Fallos: <span id="missCount">0</span>/3</span></div>
  <div class="question-panel"><div class="hebrew-verb-large" id="hebrewVerb">נַעֲשֶׂה</div></div>
  <div class="cards-grid" id="cardsContainer"></div>
  <div class="feedback" id="feedbackArea">🎯 ¿Cuál es el análisis correcto de este verbo volitivo?</div>
  <button class="action-btn" id="nextBtn">🎯 SIGUIENTE VERBO 🎯</button>
</div>
<script>
  const QUESTIONS = [
    { hebrew: "נַעֲשֶׂה", correct: "Cohortativo 1cp de עָשָׂה - hagamos", options: ["Imperativo 2ms - ¡haz!", "Cohortativo 1cp - hagamos", "Yusivo 3ms - que haga", "Imperfecto 3ms - hará"] },
    { hebrew: "אֶשְׁמְרָה", correct: "Cohortativo 1cs de שָׁמַר - que yo guarde", options: ["Imperativo 2ms - ¡guarda!", "Cohortativo 1cs - que yo guarde", "Yusivo 3ms - que él guarde", "Imperfecto 1cs - yo guardaré"] },
    { hebrew: "יִשְׁפֹּט", correct: "Yusivo 3ms de שָׁפַט - que él juzgue", options: ["Imperativo 2ms - ¡juzga!", "Cohortativo 1cs - que yo juzgue", "Yusivo 3ms - que él juzgue", "Imperfecto 3ms - él juzgará"] },
    { hebrew: "נֵלְכָה", correct: "Cohortativo 1cp de הָלַךְ - vayamos", options: ["Imperativo 2mp - ¡id!", "Cohortativo 1cp - vayamos", "Yusivo 3mp - que vayan", "Imperfecto 1cp - iremos"] },
    { hebrew: "יִסְלַח", correct: "Yusivo 3ms de סָלַח - que perdone", options: ["Imperativo 2ms - ¡perdona!", "Cohortativo 1cs - que yo perdone", "Yusivo 3ms - que él perdone", "Imperfecto 3ms - él perdonará"] },
    { hebrew: "נִקְטְלָה", correct: "Cohortativo 1cp de קָטַל - matemos", options: ["Imperativo 2mp - ¡matad!", "Cohortativo 1cp - matemos", "Yusivo 3mp - que maten", "Imperfecto 1cp - mataremos"] },
    { hebrew: "יְהִי", correct: "Yusivo 3ms de הָיָה - que sea", options: ["Imperativo 2ms - ¡sé!", "Cohortativo 1cs - que yo sea", "Yusivo 3ms - que sea", "Imperfecto 3ms - será"] },
    { hebrew: "אֶעֱבֹר", correct: "Cohortativo 1cs de עָבַר - déjame pasar", options: ["Imperativo 2ms - ¡pasa!", "Cohortativo 1cs - déjame pasar", "Yusivo 3ms - que pase", "Imperfecto 1cs - pasaré"] },
    { hebrew: "תַּעַל", correct: "Yusivo 3fs de עָלָה - que suba", options: ["Imperativo 2fs - ¡sube!", "Cohortativo 1cs - que yo suba", "Yusivo 3fs - que suba", "Imperfecto 3fs - subirá"] },
    { hebrew: "לְכוּ", correct: "Imperativo 2mp de הָלַךְ - ¡id!", options: ["Imperativo 2mp - ¡id!", "Cohortativo 1cp - vayamos", "Yusivo 3mp - que vayan", "Imperfecto 2mp - iréis"] }
  ];
  let currentQuestions = [], currentIndex = 0, correctCount = 0, streak = 0, misses = 0, maxMisses = 3, canAnswer = true, waitingNext = false, currentQ = null;
  const hebrewSpan = document.getElementById('hebrewVerb'), cardsContainer = document.getElementById('cardsContainer'), feedbackArea = document.getElementById('feedbackArea'), nextBtn = document.getElementById('nextBtn'), correctSpan = document.getElementById('correctCount'), streakSpan = document.getElementById('streakCount'), missSpan = document.getElementById('missCount');
  function shuffleArray(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
  function updateUI() { correctSpan.innerText = correctCount; streakSpan.innerText = streak; missSpan.innerText = misses; }
  function spawnReward(emoji, element) { const rect = element.getBoundingClientRect(); const div = document.createElement('div'); div.innerText = emoji; div.className = 'reward'; div.style.left = rect.left + rect.width/2 - 20 + 'px'; div.style.top = rect.top - 15 + 'px'; document.body.appendChild(div); setTimeout(() => div.remove(), 800); }
  function gameOver() { feedbackArea.innerHTML = "💀 ¡DEMASIADOS ERRORES! Reiniciando... 💀"; canAnswer = false; waitingNext = true; setTimeout(() => resetGame(), 2000); }
  function resetGame() { correctCount = 0; streak = 0; misses = 0; canAnswer = true; waitingNext = false; updateUI(); initRound(); }
  function loadQuestion() {
    if (currentIndex >= currentQuestions.length) { feedbackArea.innerHTML = "🎉 ¡MAESTRO VOLITIVO! +50 puntos. ¡Nueva ronda! 🎉"; setTimeout(() => initRound(), 1500); return; }
    canAnswer = true; waitingNext = false; nextBtn.disabled = false;
    currentQ = currentQuestions[currentIndex];
    hebrewSpan.innerText = currentQ.hebrew;
    let opts = [...currentQ.options]; if (!opts.includes(currentQ.correct)) opts.push(currentQ.correct);
    opts = shuffleArray(opts);
    cardsContainer.innerHTML = '';
    opts.forEach(opt => { const card = document.createElement('div'); card.classList.add('card-btn'); card.innerText = opt; card.addEventListener('click', (e) => handleAnswer(opt, card)); cardsContainer.appendChild(card); });
    feedbackArea.innerHTML = "🎯 ¿Cuál es el análisis correcto de este verbo volitivo?";
  }
  function handleAnswer(selected, cardElement) {
    if (!canAnswer || waitingNext) return;
    const isCorrect = (selected === currentQ.correct); const allCards = document.querySelectorAll('.card-btn');
    if (isCorrect) { correctCount++; streak++; feedbackArea.innerHTML = `✅ ¡CORRECTO! Racha: ${streak}`; cardElement.classList.add('correct-card'); spawnReward("✅", cardElement); updateUI(); }
    else { misses++; streak = 0; feedbackArea.innerHTML = `❌ INCORRECTO. Respuesta correcta: "${currentQ.correct}". Fallos: ${misses}/${maxMisses}`; cardElement.classList.add('wrong-card'); spawnReward("💔", cardElement); updateUI(); allCards.forEach(card => { if (card.innerText === currentQ.correct) { card.style.border = "3px solid gold"; card.style.background = "#27ae60"; } }); if (misses >= maxMisses) { gameOver(); return; } }
    canAnswer = false; waitingNext = true;
    allCards.forEach(card => { card.classList.add('disabled-card'); card.style.pointerEvents = 'none'; });
    nextBtn.disabled = false;
  }
  function nextQuestion() { if (!waitingNext && canAnswer) { feedbackArea.innerHTML = "⚠️ ¡Responde antes de continuar! ⚠️"; return; } currentIndex++; loadQuestion(); }
  function initRound() { let shuffled = shuffleArray([...QUESTIONS]); currentQuestions = shuffled.slice(0, 10); currentIndex = 0; canAnswer = true; waitingNext = false; loadQuestion(); }
  nextBtn.addEventListener('click', nextQuestion); initRound();
</script>
</body>
</html>
